
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive 100 Days as a King</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --gold: #e7bd68;
  --bg: #090b0b;
  --panel: rgba(19, 22, 20, .96);
  --muted: #a6aaa1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 35%, #283126 0%, #101510 42%, #070909 100%);
  color: #f4f0e7;
  font-family: Inter, sans-serif;
  display: grid;
  place-items: center;
  padding: 24px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: url("https://www.transparenttextures.com/patterns/black-scales.png");
}
main {
  position: relative;
  width: min(100%, 450px);
  padding: 36px;
  background: var(--panel);
  border: 1px solid #655333;
  box-shadow: 0 24px 100px #000b;
  border-radius: 12px;
}
.crown { text-align: center; font-size: 40px; }
h1 {
  font: 800 clamp(24px, 5vw, 34px)/1.25 Cinzel, serif;
  text-align: center;
  color: var(--gold);
  margin: 12px 0 8px;
  letter-spacing: 1px;
}
.subtitle {
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.7;
  margin: 0 0 27px;
}
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, #8e713e, transparent);
  margin: 22px 0;
}
.tabs { display: flex; gap: 8px; margin-bottom: 22px; }
.tabs button {
  flex: 1;
  padding: 12px 6px;
  color: #aaa99f;
  background: #111411;
  border: 1px solid #34382e;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
}
.tabs button.active {
  color: var(--gold);
  border-color: var(--gold);
  background: #302719;
}
label {
  display: block;
  color: #ded9cb;
  font-size: 12px;
  font-weight: 600;
  margin: 16px 0 8px;
}
input {
  display: block;
  width: 100%;
  padding: 13px 14px;
  color: white;
  background: #0b0d0c;
  border: 1px solid #383c34;
  border-radius: 5px;
  outline: none;
  font-size: 14px;
}
input:focus { border-color: var(--gold); }
.primary {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: 1px solid #f0d18c;
  border-radius: 5px;
  background: linear-gradient(110deg, #c49a4d, #f1d28d, #c49a4d);
  color: #17130b;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
}
.primary:hover { filter: brightness(1.1); }
button:disabled { opacity: .55; cursor: wait; }
.message {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border: 1px solid #46533d;
  border-radius: 5px;
  color: #d6e6c9;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.message.error {
  display: block;
  color: #ffb9a9;
  border-color: #77483e;
  background: #291614;
}
.message.success {
  display: block;
  background: #172318;
}
.small {
  text-align: center;
  font-size: 11px;
  color: #777c72;
  line-height: 1.7;
}

/* ROYAL MAIN MENU */
#gameMenu {
  display: none;
  text-align: center;
  width: 100%;
}

#gameMenu .menu-header {
  padding: 12px 0 24px;
}

#gameMenu .crown {
  font-size: 54px;
  color: #e7bd68;
  text-shadow: 0 0 28px #c69b4d55;
}

#gameMenu h1 {
  font-size: clamp(25px, 5vw, 38px);
  margin: 10px 0;
}

#gameMenu h2 {
  font-family: Cinzel, serif;
  color: #e7bd68;
  font-size: 23px;
  margin: 0 0 10px;
}

#gameMenu .subtitle {
  margin-bottom: 18px;
}

.player-badge {
  display: inline-block;
  padding: 9px 15px;
  border: 1px solid #655333;
  border-radius: 30px;
  background: #282319;
  color: #e7bd68;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.menu-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 17px;
  margin: 12px 0;
  background: linear-gradient(110deg, #20251d, #111411);
  border: 1px solid #51452e;
  border-radius: 6px;
  color: #f4f0e7;
  cursor: pointer;
  font-family: Cinzel, serif;
  font-size: 14px;
  font-weight: 700;
  text-align: left;
  transition: border-color .2s, background .2s, transform .2s;
}

.menu-button:hover:not(:disabled) {
  border-color: #e7bd68;
  background: #302719;
  transform: translateY(-1px);
}

.menu-button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

.menu-button .menu-icon {
  font-size: 23px;
}

.menu-button .menu-description {
  display: block;
  margin-top: 5px;
  color: #a6aaa1;
  font-family: Inter, sans-serif;
  font-size: 11px;
  font-weight: 400;
}

.menu-button .arrow {
  color: #e7bd68;
  font-size: 22px;
}

#gameMenu .logout-button {
  justify-content: center;
  margin-top: 22px;
  background: transparent;
  border-color: #39382f;
  color: #b6b2a6;
  font-family: Inter, sans-serif;
  font-size: 12px;
}

#gameMenu .logout-button:hover {
  border-color: #a65b4b;
  color: #ffb9a9;
}

#subScreen {
  display: none;
  text-align: center;
}

#subScreen h2 {
  font-family: Cinzel, serif;
  color: #e7bd68;
}

#subScreen .back-button {
  justify-content: center;
}

@media (max-width: 480px) {
  main { padding: 24px 18px; }
  .menu-button { padding: 14px; }
}

</style>
</head>
<body>
<main>
  <section id="authScreen">
    <div class="crown">♛</div>
    <h1>SURVIVE 100<br>DAYS AS A KING</h1>
    <p class="subtitle">YOUR KINGDOM AWAITS<br>Survive. Build. Conquer.</p>
    <div class="divider"></div>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">LOGIN</button>
      <button type="button" id="signupTab">CREATE ACCOUNT</button>
    </div>

    <form id="authForm">
      <div id="usernameField" hidden>
        <label for="username">KINGDOM NAME / USERNAME</label>
        <input id="username" type="text" minlength="3" maxlength="20"
          autocomplete="nickname" placeholder="Choose your name">
      </div>

      <label for="email">EMAIL ADDRESS</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="kingdom@example.com" required>

      <label for="password">PASSWORD</label>
      <input id="password" type="password" minlength="8"
        autocomplete="current-password" placeholder="At least 8 characters"
        required>

      <button class="primary" id="submitButton" type="submit">
        ENTER THE KINGDOM
      </button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div class="divider"></div>
    <p class="small">A NEW KINGDOM RISES.<br>Choose your destiny.</p>
  </section>


<section id="gameMenu">
  <div class="menu-header">
    <div class="crown">♛</div>
    <h1>SURVIVE 100<br>DAYS AS A KING</h1>
    <p class="subtitle">SURVIVE. BUILD. CONQUER.</p>
    <div class="player-badge" id="playerBadge">♟ Loading your profile...</div>
  </div>

  <div class="divider"></div>

  <button class="menu-button" id="playButton">
    <span>
      <span class="menu-icon">⚔️</span> PLAY
      <span class="menu-description">Begin je reis als koning</span>
    </span>
    <span class="arrow">›</span>
  </button>

  <button class="menu-button" id="skinsButton">
    <span>
      <span class="menu-icon">🛡️</span> CHARACTER & SKINS
      <span class="menu-description">Bekijk je personage en uitrusting</span>
    </span>
    <span class="arrow">›</span>
  </button>

  <button class="menu-button" id="partyButton">
    <span>
      <span class="menu-icon">🏰</span> PARTY LOBBY
      <span class="menu-description">Speel samen met je vrienden</span>
    </span>
    <span class="arrow">›</span>
  </button>

  <div class="divider"></div>
  <p class="small">DAY 1 / 100 · YOUR KINGDOM AWAITS</p>

  <button class="menu-button logout-button" id="logoutButton">
    LOG OUT
  </button>
</section>

<section id="subScreen">
  <div class="crown">♛</div>
  <h2 id="subTitle">YOUR KINGDOM</h2>
  <p class="subtitle" id="subDescription"></p>
  <div class="divider"></div>
  <div id="subContent"></div>
  <button class="menu-button back-button" id="backButton">
    ‹ BACK TO MAIN MENU
  </button>
</section>
</main>

<script>
const SUPABASE_URL = "https://akkpddhexogrtafgwpsb.supabase.co";
const SUPABASE_KEY = "sb_publishable_ETN4qXfCXymLEpvJbKKztQ_1U_fHvYc";

// Stop safely until your real Supabase settings have been entered.
const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("VUL_HIER") &&
  SUPABASE_KEY.length > 20 &&
  !SUPABASE_KEY.includes("VUL_HIER");

let client = null;
if (configured && window.supabase) {
  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const form = document.getElementById("authForm");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const usernameField = document.getElementById("usernameField");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");
let mode = "login";

function showMessage(text, type = "success") {
  message.textContent = text;
  message.className = "message " + type;
}

function setMode(nextMode) {
  mode = nextMode;
  const signup = mode === "signup";
  loginTab.classList.toggle("active", !signup);
  signupTab.classList.toggle("active", signup);
  usernameField.hidden = !signup;
  document.getElementById("password").autocomplete =
    signup ? "new-password" : "current-password";
  submitButton.textContent = signup
    ? "CREATE YOUR KINGDOM"
    : "ENTER THE KINGDOM";
  message.className = "message";
  message.textContent = "";
}

loginTab.addEventListener("click", () => setMode("login"));
signupTab.addEventListener("click", () => setMode("signup"));



async function showGame(user) {
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("subScreen").style.display = "none";
  document.getElementById("gameMenu").style.display = "block";

  const badge = document.getElementById("playerBadge");
  badge.textContent = "♟ Loading your profile...";

  let profile = {
    username: user.user_metadata?.username ||
      user.email?.split("@")[0] || "King",
    skin: "default"
  };

  try {
    const { data, error } = await client
      .from("profiles")
      .select("username, skin")
      .eq("id", user.id)
      .single();

    if (error) throw error;
    profile = data;
  } catch (error) {
    console.error("Profile loading failed:", error);
  }

  badge.textContent = "♟ " + profile.username;
  window.currentKing = {
    id: user.id,
    username: profile.username,
    skin: profile.skin || "default"
  };
}

function openSubScreen(title, description, content) {
  document.getElementById("gameMenu").style.display = "none";
  document.getElementById("subScreen").style.display = "block";
  document.getElementById("subTitle").textContent = title;
  document.getElementById("subDescription").textContent = description;

  const container = document.getElementById("subContent");
  container.replaceChildren();
  container.appendChild(content);
}

function makeInfo(text) {
  const p = document.createElement("p");
  p.className = "subtitle";
  p.textContent = text;
  return p;
}

// PLAY
document.getElementById("playButton").addEventListener("click", () => {
  const content = document.createElement("div");
  content.appendChild(makeInfo(
    "Your journey begins here. The 3D survival world is the next stage of development."
  ));

  const status = document.createElement("div");
  status.className = "player-badge";
  status.textContent = "COMING SOON · DAY 1 / 100";
  content.appendChild(status);

  openSubScreen(
    "YOUR KINGDOM AWAITS",
    "Prepare to survive 100 days.",
    content
  );
});

// CHARACTER & SKINS
document.getElementById("skinsButton").addEventListener("click", () => {
  const content = document.createElement("div");

  const king = window.currentKing;
  if (!king) return;

  const name = document.createElement("p");
  name.className = "player-badge";
  name.textContent = "♟ " + king.username;
  content.appendChild(name);

  const preview = document.createElement("div");
  preview.style.cssText = "font-size:72px;padding:20px";
  preview.textContent = "♞";
  content.appendChild(preview);

  const label = document.createElement("label");
  label.htmlFor = "skinSelect";
  label.textContent = "CHOOSE YOUR ROYAL COLORS";
  content.appendChild(label);

  const select = document.createElement("select");
  select.id = "skinSelect";
  select.style.cssText =
    "width:100%;padding:13px;background:#0b0d0c;color:#fff;border:1px solid #655333;border-radius:5px";

  const skins = [
    ["default", "Royal Gold (Default)"],
    ["royal_blue", "Royal Blue"],
    ["forest_green", "Forest Green"],
    ["crimson", "Crimson Red"]
  ];

  for (const [value, text] of skins) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = text;
    select.appendChild(option);
  }

  select.value = skins.some(([value]) => value === king.skin)
    ? king.skin
    : "default";

  content.appendChild(select);

  const save = document.createElement("button");
  save.className = "primary";
  save.textContent = "SAVE CHARACTER";
  save.addEventListener("click", async () => {
    save.disabled = true;
    save.textContent = "SAVING...";

    try {
      const { error } = await client
        .from("profiles")
        .update({ skin: select.value })
        .eq("id", king.id);

      if (error) throw error;

      king.skin = select.value;
      document.getElementById("playerBadge").textContent =
        "♟ " + king.username + " · " + king.skin.toUpperCase();

      save.textContent = "SAVED ✓";
    } catch (error) {
      console.error(error);
      save.textContent = "SAVE FAILED";
      alert("Could not save your skin. Check your Supabase policies.");
    } finally {
      save.disabled = false;
    }
  });

  content.appendChild(save);

  openSubScreen(
    "CHARACTER & SKINS",
    "Your look, your kingdom.",
    content
  );
});

// PARTY LOBBY — real multiplayer comes next
document.getElementById("partyButton").addEventListener("click", () => {
  const content = document.createElement("div");
  content.appendChild(makeInfo(
    "Soon you will be able to create a party, share a code and invite friends."
  ));

  const status = document.createElement("div");
  status.className = "player-badge";
  status.textContent = "PARTY SYSTEM · IN DEVELOPMENT";
  content.appendChild(status);

  openSubScreen(
    "PARTY LOBBY",
    "No king survives alone.",
    content
  );
});

// BACK TO MAIN MENU
document.getElementById("backButton").addEventListener("click", () => {
  document.getElementById("subScreen").style.display = "none";
  document.getElementById("gameMenu").style.display = "block";
});

 
form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!client) {
    showMessage("Supabase is niet correct ingesteld.", "error");
    return;
  }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value.trim();

  if (mode === "signup" && !/^[a-zA-Z0-9_-]{3,20}$/.test(username)) {
    showMessage(
      "Choose a username of 3–20 characters using letters, numbers, _ or -.",
      "error"
    );
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "PLEASE WAIT...";
  message.className = "message";

  try {
    if (mode === "signup") {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { username },
          emailRedirectTo: window.location.href.split("#")[0]
        }
      });

      if (error) throw error;
      await showGame(data.user);
    }
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Something went wrong. Try again.", "error");
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = mode === "signup"
      ? "CREATE YOUR KINGDOM"
      : "ENTER THE KINGDOM";
  }
});

      if (error) throw error;

      if (data.session && data.user) {
        showGame(data.user);
      } else {
        showMessage(
          "Account created! Check your email and click the confirmation link before logging in."
        );
        setMode("login");
      }
    } else {
      const { data, error } = await client.auth.signInWithPassword({
        email, password
      });

document.getElementById("logoutButton").addEventListener("click", async () => {
  if (!client) return;
  const button = document.getElementById("logoutButton");
  button.disabled = true;
  try {
    const { error } = await client.auth.signOut();
    if (error) throw error;
    document.getElementById("gameMenu").style.display = "none";
    document.getElementById("authScreen").style.display = "block";
    setMode("login");
    form.reset();
  } catch (error) {
    alert(error.message || "Could not log out.");
  } finally {
    button.disabled = false;
  }
});

async function restoreSession() {
  if (!client) return;
  const { data, error } = await client.auth.getSession();
  if (!error && data.session) showGame(data.session.user);
}

restoreSession();
</script>
</body>
</html>
